apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop
  namespace: argocd
spec:
  description: Instructor-owned OKE workshop
  sourceRepos:
    - {{ .Values.config.spec.source.repoURL | quote }}
    - "https://oracle.github.io/karpenter-provider-oci/charts"
  destinations:
    - server: {{ .Values.config.spec.destination.server | quote }}
      namespace: workshop-kpo
{{- range .Values.applications }}
{{- if ne .enabled false }}
    - server: {{ $.Values.config.spec.destination.server | quote }}
      namespace: {{ .destination.namespace | quote }}
{{- end }}
{{- end }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.sh
      kind: NodeClaim
    - group: karpenter.sh
      kind: NodeOverlay
    - group: autoscaling.x-k8s.io
      kind: CapacityBuffer
    - group: oci.oraclecloud.com
      kind: OCINodeClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: LimitRange
    - group: ""
      kind: Pod
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Secret
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute