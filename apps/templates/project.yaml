apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop
  namespace: argocd
spec:
  description: Instructor-owned OKE workshop

  sourceRepos:
    - {{ .Values.config.spec.source.repoURL | quote }}
    - "https://oracle.github.io/karpenter-provider-oci/charts"
    - "https://kubernetes-sigs.github.io/metrics-server/"
    - "https://kedacore.github.io/charts"
    - "https://kyverno.github.io/kyverno/"

  destinations:
    - server: {{ .Values.config.spec.destination.server | quote }}
      namespace: workshop-kpo

    - server: {{ .Values.config.spec.destination.server | quote }}
      namespace: karpenter-system

    - server: {{ .Values.config.spec.destination.server | quote }}
      namespace: kube-system

    - server: {{ .Values.config.spec.destination.server | quote }}
      namespace: kube-node-lease

    - server: {{ .Values.config.spec.destination.server | quote }}
      namespace: envoy-gateway-system

{{- range .Values.applications }}
{{- if ne .enabled false }}
    - server: {{ $.Values.config.spec.destination.server | quote }}
      namespace: {{ .destination.namespace | quote }}
{{- end }}
{{- end }}

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: apiregistration.k8s.io
      kind: APIService

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    # Karpenter Provider for OCI
    - group: karpenter.sh
      kind: NodePool

    - group: karpenter.sh
      kind: NodeClaim

    - group: karpenter.sh
      kind: NodeOverlay

    - group: autoscaling.x-k8s.io
      kind: CapacityBuffer

    - group: oci.oraclecloud.com
      kind: OCINodeClass

    # Gateway API
    - group: gateway.networking.k8s.io
      kind: GatewayClass

    # KEDA
    - group: keda.sh
      kind: ClusterTriggerAuthentication

    # Kyverno
    - group: kyverno.io
      kind: ClusterPolicy

    - group: kyverno.io
      kind: ClusterCleanupPolicy

    - group: kyverno.io
      kind: GlobalContextEntry

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap

    - group: ""
      kind: LimitRange

    - group: ""
      kind: Pod

    - group: ""
      kind: ResourceQuota

    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: ""
      kind: Secret

    - group: apps
      kind: Deployment

    - group: apps
      kind: DaemonSet

    - group: apps
      kind: StatefulSet

    - group: batch
      kind: Job

    - group: batch
      kind: CronJob

    - group: policy
      kind: PodDisruptionBudget

    - group: networking.k8s.io
      kind: NetworkPolicy

    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: autoscaling
      kind: HorizontalPodAutoscaler

    # Gateway API
    - group: gateway.networking.k8s.io
      kind: Gateway

    - group: gateway.networking.k8s.io
      kind: HTTPRoute

    - group: gateway.networking.k8s.io
      kind: ReferenceGrant

    # Envoy Gateway
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy

    # KEDA
    - group: keda.sh
      kind: ScaledObject

    - group: keda.sh
      kind: ScaledJob

    - group: keda.sh
      kind: TriggerAuthentication

    # Kyverno
    - group: kyverno.io
      kind: Policy

    - group: kyverno.io
      kind: PolicyException

    - group: kyverno.io
      kind: CleanupPolicy

    - group: kyverno.io
      kind: UpdateRequest

    # Optional Prometheus integration
    - group: monitoring.coreos.com
      kind: ServiceMonitor

    - group: monitoring.coreos.com
      kind: PrometheusRule