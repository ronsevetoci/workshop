apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-demo
  namespace: {{ .Values.namespace.name | quote }}
spec:
  replicas: {{ .Values.demo.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: governance-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governance-demo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      tolerations:
  {{ toYaml .Values.demo.tolerations | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
{{ toYaml .Values.demo.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: governance-demo
  namespace: {{ .Values.namespace.name | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: governance-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
