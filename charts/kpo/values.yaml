namespace:
  name: workshop-kpo

oci:
  # Required: subnet used by the primary VNIC of KPO-provisioned worker nodes.
  workerSubnetId: "ocid1.subnet.oc1.me-jeddah-1.aaaaaaaa2tc6yawncwe4yoobzplniufch6vpqlwcmwz55yd3shdmuo2psrya"

  # Optional: NSGs attached to the primary worker-node VNIC.
  primaryNetworkSecurityGroupIds: ["ocid1.networksecuritygroup.oc1.me-jeddah-1.aaaaaaaa2jer53rca2xj2utejsgdg3kvizbxegpmkgtxif4l5gvcn6rw6tha"]

  # Secondary VNIC profiles used by the OCI VCN-native CNI for pod networking.
  secondaryVnicConfigs:
    - name: pod-default
      # Required: private regional pod subnet.
      subnetId: "ocid1.subnet.oc1.me-jeddah-1.aaaaaaaake4l2s7epn2l26nqez6ive5thbhdxpy5wck57eaf7cze3yg2ho5a"

      # Must be a power of two.
      ipCount: 32

      # Optional: NSGs attached to this secondary VNIC.
      networkSecurityGroupIds: ["ocid1.networksecuritygroup.oc1.me-jeddah-1.aaaaaaaac2bks2gkcsqu7anexc7ac6s3zyglyxauiuipbpbhk4hnctvehlhq"]

      # Optional: use only when workloads must select this profile
      # through an extended resource request.
      applicationResource: ""

  # Optional: set when KPO should launch nodes in a different compartment.
  nodeCompartmentId: ""

  # Optional: use an explicit OKE image OCID instead of imageFilter.
  imageId: ""

  imageFilter:
    osFilter: Oracle Linux
    osVersionFilter: "9"

nodePool:
  name: workshop-kpo-apps
  nodeClassName: workshop-kpo-apps

  labels:
    workshop.oracle.com/workload-tier: kpo-apps

  shapes:
    - VM.Standard.E4.Flex
    - VM.Standard.E5.Flex

  capacityTypes:
    - on-demand

  shapeConfigs:
    - ocpus: 2
      memoryInGbs: 8
    - ocpus: 4
      memoryInGbs: 16

  taints:
    - key: workshop.oracle.com/kpo-apps
      value: "true"
      effect: NoSchedule

  limits:
    cpu: "8"
    memory: 32Gi

  expireAfter: Never
  terminationGracePeriod: 30m

  disruption:
    consolidateAfter: 10m
    consolidationPolicy: WhenEmpty

workload:
  name: kpo-scale-demo
  replicas: 1

  image:
    repository: docker.io/library/nginx
    tag: 1.27-alpine
    pullPolicy: IfNotPresent

  nodeSelector:
    karpenter.sh/nodepool: workshop-kpo-apps

  tolerations:
    - key: workshop.oracle.com/kpo-apps
      operator: Equal
      value: "true"
      effect: NoSchedule

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  hpa:
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60