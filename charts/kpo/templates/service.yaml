apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.workload.name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: {{ .Values.workload.name | quote }}

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP