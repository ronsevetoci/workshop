apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workload.name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: {{ .Values.workload.replicas }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workload.name | quote }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.workload.name | quote }}

    spec:
      nodeSelector:
{{ toYaml .Values.workload.nodeSelector | nindent 8 }}

      tolerations:
{{ toYaml .Values.workload.tolerations | nindent 8 }}

      containers:
        - name: nginx
          image: "{{ .Values.workload.image.repository }}:{{ .Values.workload.image.tag }}"
          imagePullPolicy: {{ .Values.workload.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
{{ toYaml .Values.workload.resources | nindent 12 }}