{{ if .Values.demo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.demo.replicas }}
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      nodeSelector:
{{ toYaml .Values.dataPlane.nodeSelector | nindent 8 }}
      tolerations:
{{ toYaml .Values.dataPlane.tolerations | nindent 8 }}
      containers:
        - name: echoserver
          image: {{ .Values.demo.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{ end }}