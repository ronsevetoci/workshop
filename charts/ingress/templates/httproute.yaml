{{ if .Values.demo.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: public-gateway
      sectionName: http
{{ if .Values.tls.enabled }}
    - name: public-gateway
      sectionName: https
{{ end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-app
          port: 80
{{ end }}