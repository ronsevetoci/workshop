apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: {{ .Values.namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: hpa-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hpa-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hpa-demo
    spec:
      containers:
        - name: hpa-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
{{ toYaml .Values.resources | nindent 12 }}